[package]
name = "laio"
version = "0.17.0"
edition = "2024"
description = "A simple flexbox-like layout manager for tmux."
homepage = "https://github.com/ck3mp3r/laio-cli"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
panic = "abort"
strip = "symbols"

[dependencies]
clap-verbosity-flag = "3.0.4"
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
crossterm = "0.29.0"
env_logger = "0.11.11"
inquire = "0.9.4"
lazy_static = "1.5.0"
log = "0.4.34"
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tabled = "0.22.0"
tera = "2.4.0"
urlencoding = "2.1.3"

[dependencies.noyalib]
version = "0.0.44"
features = ["compat-serde-yaml"]

[dependencies.clap]
version = "4.6.7"
features = ["derive"]

[dependencies.kdl]
version = "6.5.0"
features = ["v1"]

[dependencies.miette]
version = "7.6.0"
features = ["fancy"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dev-dependencies]
lazy_static = "1.5.0"
mockall = "0.15.0"
