---
name: CI
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "src/**"
      - "tests/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Format
        run: nix develop .#ci --command cargo fmt -- --check

      - name: Clippy
        run: nix develop .#ci --command cargo clippy --workspace --tests -- -D warnings

      - name: Build workspace
        run: nix develop .#ci --command cargo build --workspace

      - name: Test
        run: nix develop .#ci --command cargo nextest run --profile ci

      # nextest writes the ci profile report to target/nextest/ci/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: target/nextest/ci/junit.xml

      - name: Nix build package
        run: nix build .#laio